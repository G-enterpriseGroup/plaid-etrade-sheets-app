name: Put Money Flow - Yahoo Options

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique Apps Script request id
        required: true
        type: string
      mode:
        description: expirations, strikes, or quotes
        required: true
        type: string
      row:
        description: Put Money Flow row for picker requests
        required: false
        default: ''
        type: string
      ticker:
        description: Underlying ticker
        required: false
        default: ''
        type: string
      option_type:
        description: CALL or PUT
        required: false
        default: ''
        type: string
      expiration:
        description: YYYY-MM-DD
        required: false
        default: ''
        type: string
      contracts_json:
        description: JSON array of completed option rows for quote refresh
        required: false
        default: '[]'
        type: string

permissions:
  contents: read

concurrency:
  group: put-money-flow-yfinance-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  yahoo-options:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yfinance
        run: |
          python -m pip install --upgrade pip
          pip install 'yfinance>=0.2.51,<2' 'pandas>=2.2,<3'

      - name: Run Yahoo option request
        env:
          PMF_REQUEST_ID: ${{ inputs.request_id }}
          PMF_MODE: ${{ inputs.mode }}
          PMF_ROW: ${{ inputs.row }}
          PMF_TICKER: ${{ inputs.ticker }}
          PMF_OPTION_TYPE: ${{ inputs.option_type }}
          PMF_EXPIRATION: ${{ inputs.expiration }}
          PMF_CONTRACTS_JSON: ${{ inputs.contracts_json }}
        run: |
          python backend/put_money_flow_yfinance.py \
            --request-id "$PMF_REQUEST_ID" \
            --mode "$PMF_MODE" \
            --row "$PMF_ROW" \
            --ticker "$PMF_TICKER" \
            --option-type "$PMF_OPTION_TYPE" \
            --expiration "$PMF_EXPIRATION" \
            --contracts-json "$PMF_CONTRACTS_JSON"

      - name: Upload result for Apps Script
        uses: actions/upload-artifact@v4
        with:
          name: pmf-${{ inputs.request_id }}
          path: /tmp/pmf_result.json
          if-no-files-found: error
          retention-days: 1
