name: Put Money Flow - Yahoo Options

on:
  schedule:
    # Every 5 minutes during the regular U.S. trading session, New York time.
    # Offset from top-of-hour congestion; final pass just after the 4:00 PM close.
    - cron: '31-56/5 9 * * 1-5'
      timezone: America/New_York
    - cron: '1-56/5 10-15 * * 1-5'
      timezone: America/New_York
    - cron: '1 16 * * 1-5'
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: put-money-flow-yfinance
  cancel-in-progress: true

jobs:
  refresh-put-money-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Yahoo and Google Sheets dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            'yfinance==1.5.1' \
            'pandas>=2.2,<3' \
            'google-api-python-client>=2.170,<3' \
            'google-auth>=2.40,<3'

      - name: Refresh Put Money Flow option picker and prices
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: 1sgNWMAZEIdOBargwH8ILs_oB-1HQzUoVssaqnsujY2g
        run: python backend/put_money_flow_yfinance.py
